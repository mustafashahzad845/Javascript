<main>

<div class="form-container">

<h2>Registration</h2>

<div class="input-box">
    <i class="fa-regular fa-user"></i>
<input type="text" placeholder="Enter your username" id="userNameInput">
<p id="usernameInvalidPara"></p>
</div>

<div class="input-box">
    <i class="fa-regular fa-envelope envelope-icon"></i>
<input type="text" placeholder="Enter your email" id="emailInput">
<p id="invalidEmailPara"></p>

</div>

<div class="input-box">
    <i class="fa-solid fa-lock"></i>
<input type="password" placeholder="Enter your password" id="inputPass">
<img src="./eye-image-close.png" alt="" id="passwordImg" onclick="passwordImgHandler(this)">
</div>

<div class="input-box">
    <i class="fa-solid fa-lock"></i>
<input type="password" placeholder="Enter Confirm password" id="confirmPasswordInput">
<p id="notMatchPassword"></p>
<p id="loginSucessfullyPara"></p>
</div>

<button onclick="Register()">Register Now</button>

</div>




</main>



</body>
<script src="app.js"></script>
