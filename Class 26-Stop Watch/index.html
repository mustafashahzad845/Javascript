<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
    
    <div class="stopWatchContainer">
        

<div class="timeConatiner">
           <p id="timeCounter">  </p>
        </div>
        <div class="buttonsParent">
            <button id="pauseBtn" onclick="pauseWatch()">Pause</button>
            <button id="startBtn" onclick="startWatch()">Start</button>
            <button id="resetBtn" onclick="resetWatch()">Reset</button>
        </div>
    </div>

        </main>
        
</body>
<script src="app.js"></script>
</html>
